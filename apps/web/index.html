<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>HRmit</title>
    <script>
      // Theme before first paint, so there is no flash. Mirrors src/theme.ts.
      try {
        var t = localStorage.getItem('hrmit-theme')
        document.documentElement.dataset.theme =
          t === 'dark' || t === 'light'
            ? t
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="Local-first ATS with an AI assistant. Your recruitment data stays home."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
