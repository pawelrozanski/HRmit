name: Release

# A vX.Y.Z tag builds the Windows installer and attaches it to the GitHub release (ADR 0008).
# Unsigned for now: SmartScreen warns on first run, the README says what to click.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # The Node that runs the build is the Node that ships in the installer.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: NSIS
        run: if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) { choco install nsis -y --no-progress }
      - run: pnpm --filter @hrmit/windows dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --title $env:GITHUB_REF_NAME --notes "See CHANGELOG.md." }
          gh release upload $env:GITHUB_REF_NAME (Get-ChildItem apps/windows/release/*.exe) --clobber
